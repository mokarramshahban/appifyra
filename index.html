    <!-- Immediate Theme Initialization to prevent FOIT (Flash of Incorrect Theme) -->
    <script>
      (function() {
        try {
          var storedTheme = localStorage.getItem('appifyra_theme');
          var systemLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = storedTheme ? storedTheme : (systemLight ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
